<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="./imgs/logo.png" type="image/x-icon" />

    <link rel="stylesheet" href="./css/all.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Yummy</title>
  </head>

  <body>
    <!-- ==========================
         Navigation
    ========================== -->

    <div class="side-nav-menu position-fixed top-0 d-flex">
      <!-- Navigation Links -->

      <div
        class="nav-tab d-flex flex-column justify-content-between min-vh-100 p-4"
      >
        <div class="links">
          <ul class="list-unstyled">
            <li
              onclick="
                showSearchInputs();
                closeSideNav();
              "
              class="py-2 position-relative cursor-pointer"
            >
              Search
            </li>

            <li
              onclick="
                getCategories();
                closeSideNav();
              "
              class="py-2 position-relative cursor-pointer"
            >
              Categories
            </li>

            <li
              onclick="
                getArea();
                closeSideNav();
              "
              class="py-2 position-relative cursor-pointer"
            >
              Area
            </li>

            <li
              onclick="
                getIngredients();
                closeSideNav();
              "
              class="py-2 position-relative cursor-pointer"
            >
              Ingredient
            </li>

            <li
              onclick="
                showContacts();
                closeSideNav();
              "
              class="py-2 position-relative cursor-pointer"
            >
              Contact us
            </li>
          </ul>
        </div>

        <div class="nav-footer">
          <div class="icons">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-solid fa-globe"></i>
          </div>

          <div class="footer">
            <p>
              Copyright © 2019 All Rights
              <br />
              Reserved.
            </p>
          </div>
        </div>
      </div>

      <!-- Navigation Header -->

      <div class="nav-header bg-white text-black">
        <img class="logo" src="./imgs/logo.png" alt="logo" />

        <i class="fa-solid fa-bars open-close-icon fa-2x"></i>

        <div class="nav-header-icons">
          <i class="fa-solid fa-globe"></i>

          <i class="fa-solid fa-share-nodes"></i>
        </div>
      </div>
    </div>

    <!-- ==========================
         Main Content
    ========================== -->

    <main class="main-content min-vh-100 position-relative">
      <!-- Loading Screen -->

      <div class="loading-screen">
        <i class="fa fa-spinner fa-spin fa-5x"></i>
      </div>

      <!-- Search -->

      <div class="container w-75" id="search"></div>

      <!-- Details -->

      <div class="container">
        <div class="row py-5 g-4" id="details"></div>
      </div>
    </main>

    <!-- ==========================
         Scripts
    ========================== -->

    <script src="./js/jquery-3.7.1.min.js"></script>

    <script src="./js/bootstrap.bundle.min.js"></script>

    <script src="./js/main.js"></script>
  </body>
</html>
